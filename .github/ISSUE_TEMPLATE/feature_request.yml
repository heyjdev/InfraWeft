name: Feature request
description: Propose a focused workflow, resource, importer, or exporter improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should InfraWeft solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow and expected outcome, not just the implementation.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Resource model and properties
        - Canvas and topology
        - Azure import
        - Terraform exporter
        - Bicep exporter
        - Azure CLI exporter
        - Packaging and installation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include validation, safety, and no-silent-drop expectations where relevant.
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link official provider or platform documentation when proposing cloud behavior.
